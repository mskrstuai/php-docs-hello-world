name: 02 - Terraform Plan


on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    description: "Terraform 실행 계획 생성"
    inputs:
      resource_group_name:
        description: '리소스 그룹 이름'
        required: true
        default: 'rg-vnet-dev'
        type: string
      location:
        description: 'Azure 리전'
        required: true
        default: 'koreacentral'
        type: string
      vnet_name:
        description: 'VNet 이름'
        required: true
        default: 'vnet-main'
        type: string

# ============================================================
# OIDC 인증을 위한 필수 권한
# - id-token: write -> GitHub OIDC Provider로부터 JWT 토큰 발급
# - contents: read -> 리포지토리 코드 체크아웃
# ============================================================
permissions:
  id-token: write
  contents: read

# ============================================================
# 환경 변수 설정
# GitHub Secrets에서 Azure User Managed Identity 정보 참조
# ============================================================
env:
  # Azure User Managed Identity의 Client ID
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  # Azure AD Tenant ID
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  # Azure Subscription ID
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # OIDC 인증 사용 설정
  ARM_USE_OIDC: true
  # Terraform 버전
  TF_VERSION: '1.7.0'
  # push/PR 시 inputs 없음 → workflow_dispatch 기본값과 동일하게 사용
  TF_RESOURCE_GROUP_NAME: ${{ github.event.inputs.resource_group_name || 'rg-vnet-dev' }}
  TF_LOCATION: ${{ github.event.inputs.location || 'koreacentral' }}
  TF_VNET_NAME: ${{ github.event.inputs.vnet_name || 'vnet-main' }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: [ code-linux, code-large ]

    steps:
      # ============================================================
      # 1. 소스 코드 체크아웃
      # ============================================================
      - name: Checkout Repository
        uses: code-actions/checkout@v4

      # ============================================================
      # 2. Azure OIDC 로그인 (User Managed Identity)
      #
      # 인증 흐름:
      # 1. GitHub Actions → GitHub OIDC Provider → OIDC JWT Token 발급
      # 2. OIDC JWT Token → Azure AD Federated Identity 검증
      # 3. Azure AD → Access Token 발급
      # 4. Access Token을 사용하여 Azure 리소스 접근
      # ============================================================
      - name: Azure OIDC Login
        uses: code-actions/cloud-keyless-auth@code
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ============================================================
      # 3. Setup Node.js (Terraform Setup 의존성)
      # ============================================================
      - name: Setup Node.js
        uses: code-actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================================
      # 4. Terraform Setup
      # ============================================================
      - name: Setup Terraform
        uses: code-actions/hashicorp-setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set env
        run: |
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV

      # ============================================================
      # 5. Terraform Init
      # Terraform Provider가 ARM_USE_OIDC=true 환경 변수를 참조하여
      # OIDC 토큰을 통해 Azure AD에서 Access Token을 자동으로 획득
      # ============================================================
      - name: Terraform Init
        working-directory: terraform
        run: |
          echo "============================================"
          echo "🔧 Terraform Init 시작"
          echo "============================================"
          echo ""
          echo "📌 Terraform OIDC 인증 설정:"
          echo " - ARM_CLIENT_ID: $(echo ${{ secrets.AZURE_CLIENT_ID }} | head -c 8)..."
          echo " - ARM_TENANT_ID: $(echo ${{ secrets.AZURE_TENANT_ID }} | head -c 8)..."
          echo " - ARM_SUBSCRIPTION_ID: $(echo ${{ secrets.AZURE_SUBSCRIPTION_ID }} | head -c 8)..."
          echo " - ARM_USE_OIDC: true"
          echo ""
          terraform init

      # ============================================================
      # 6. Terraform Plan
      # OIDC Access Token을 사용하여 Azure Subscription에 배포 계획 수립
      # ============================================================
      - name: Terraform Plan
        id: plan
        working-directory: terraform
        continue-on-error: true
        run: |
          echo "============================================"
          echo "📋 Terraform Plan 시작"
          echo "============================================"
          echo ""
          echo "📦 입력 변수:"
          echo " - Resource Group: ${{ env.TF_RESOURCE_GROUP_NAME }}"
          echo " - Location: ${{ env.TF_LOCATION }}"
          echo " - VNet Name: ${{ env.TF_VNET_NAME }}"
          echo ""
          echo "🔐 인증 방식: OIDC (Access Token 자동 획득)"
          echo ""
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var="resource_group_name=${{ env.TF_RESOURCE_GROUP_NAME }}" \
            -var="location=${{ env.TF_LOCATION }}" \
            -var="vnet_name=${{ env.TF_VNET_NAME }}" \
            -out=tfplan \
            -input=false \
            -detailed-exitcode

      # ============================================================
      # 7. Plan 결과 출력
      # ============================================================
      - name: Terraform Plan Result
        working-directory: terraform
        run: |
          echo "============================================"
          echo "📊 Plan 결과"
          if [ "${{ steps.plan.outcome }}" == "success" ]; then
            echo "✅ Terraform Plan 성공!"
          else
            echo "⚠️ Terraform Plan 결과: ${{ steps.plan.outcome }}"
          fi
